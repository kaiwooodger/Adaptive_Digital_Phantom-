    replacement_role: splenic_portal_venous_return
notes:
  - Single public MedSeg teaching case with 43 abdominal vascular labels.
  - Labels are used as branch-rich centerline templates, then anchored into the project phantom graph.
  - This is not a patient-specific registration into CT-ORG unless an explicit registration transform is added later.

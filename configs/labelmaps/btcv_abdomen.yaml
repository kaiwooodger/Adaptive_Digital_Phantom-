notes:
  - BTCV Abdomen RawData training labels provide same-grid CT and multi-organ labels.
  - Major vessel labels are coarse: aorta, inferior vena cava, and a combined portal/splenic vein label.
  - This dataset is useful for paired organ/major-vessel grounding, but it is not branch-rich CTA/CTV.
